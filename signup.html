<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourist fun | Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Yahan apni background image ka naam dalo */
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('32349.jpg') no-repeat center center/cover;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15); /* Transparent white */
            backdrop-filter: blur(15px); /* Blurry effect */
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            width: 400px;
            border-radius: 30px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            color: white;
            text-align: center;
        }

        .logo { font-size: 26px; font-weight: 600; margin-bottom: 5px; }
        .tagline { font-size: 12px; opacity: 0.8; margin-bottom: 30px; letter-spacing: 1px; }

        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 8px; opacity: 0.9; }
        
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            outline: none;
            color: white;
            font-size: 14px;
        }

        .input-group input::placeholder { color: rgba(255, 255, 255, 0.6); }

        .signup-btn {
            width: 100%;
            padding: 15px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .signup-btn:hover {
            background: #2ecc71;
            color: white;
            transform: translateY(-2px);
        }

        .footer-text { margin-top: 25px; font-size: 13px; opacity: 0.8; }
        .footer-text a { color: #fff; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="logo">Tourist fun</div>
        <div class="tagline">EXPLORE THE UNKNOWN</div>

        <h2 style="margin-bottom: 20px;">Create Account</h2>

        <form onsubmit="handleSignup(event)">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="uname" placeholder="Enter your name" required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="uemail" placeholder="email@example.com" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="upass" placeholder="••••••••" required>
            </div>

            <button type="submit" class="signup-btn">Let's Get Started</button>
        </form>

        <p class="footer-text">Already have an account? <a href="#">Log In</a></p>
    </div>

    <script>
        function handleSignup(e){
            e.preventDefault();
            const name = document.getElementById('uname').value;
            const email = document.getElementById('uemail').value;
            const mahirPhone = "919824576927";

            const message = `*Travel Voyanix Signup*%0A*Name:* ${name}%0A*Email:* ${email}`;
            window.open(`https://wa.me/${mahirPhone}?text=${message}`,'_blank');
        }
    </script>
</body>
</html>
