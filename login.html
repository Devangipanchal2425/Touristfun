<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Voyanix | Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Wahi background image rakhein jo signup mein hai */
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('32349.jpg') no-repeat center center/cover;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            width: 400px;
            border-radius: 30px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            color: white;
            text-align: center;
        }

        .logo { font-size: 26px; font-weight: 600; margin-bottom: 5px; }
        .tagline { font-size: 12px; opacity: 0.8; margin-bottom: 30px; letter-spacing: 1px; }

        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 8px; opacity: 0.9; }
        
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            outline: none;
            color: white;
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: #2ecc71; /* Green for Action */
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover { background: #27ae60; transform: translateY(-2px); }

        .footer-text { margin-top: 25px; font-size: 13px; opacity: 0.8; }
        .footer-text a { color: #fff; font-weight: 600; text-decoration: none; }
        
        .forgot-pass { display: block; margin-top: 10px; font-size: 11px; color: #eee; text-decoration: none; }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="logo">Tourist fun</div>
        <div class="tagline">WELCOME BACK</div>

        <h2 style="margin-bottom: 20px;">Log In</h2>

        <form action="index.html"> <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
                <a href="#" class="forgot-pass">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Log In</button>
        </form>

        <p class="footer-text">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>

</body>
</html>
