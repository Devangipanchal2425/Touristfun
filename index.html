<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Adventure - All Sections</title>
    <style>
        /* --- 1. BASE STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=80&w=2021&auto=format&fit=crop') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-attachment: fixed;
            padding: 20px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            border-radius: 30px;
            overflow-y: auto; /* Scroll enabled taaki purana kaam na hatey */
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            scroll-behavior: smooth;
        }

        /* Scrollbar styling (Chupaane ke liye) */
        .glass-panel::-webkit-scrollbar { width: 5px; }
        .glass-panel::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }

        /* --- 2. NAVIGATION --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            position: absolute;
            width: 100%;
            z-index: 10;
            .plan-btn {
    background: #e67e22;
    color: white !important;
    padding: 8px 18px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: bold;
}
        }
        .logo { font-weight: bold; font-size: 1.5rem; color: #fff; text-shadow: 1px 1px 5px rgba(0,0,0,0.3); }
        .nav-links a { color: #fff; text-decoration: none; margin: 0 15px; font-size: 14px; font-weight: 500; }
        .auth-buttons .signup { background: #fff; padding: 10px 25px; border-radius: 25px; text-decoration: none; color: #333; font-weight: bold; }

        /* --- 3. HERO SECTION --- */
        .hero {
            height: 500px;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1454496522488-7a8e488e8606?q=80&w=2076&auto=format&fit=crop') center/cover;
            border-radius: 30px 30px 0 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 50px;
            color: white;
        }
        .hero h1 { font-size: 3.5rem; max-width: 600px; }

        /* --- 4. SEARCH BAR --- */
        .search-container {
            background: white;
            width: 85%;
            margin: -40px auto 40px;
            padding: 25px;
            border-radius: 60px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            z-index: 5;
        }

        /* --- 5. DESTINATIONS SECTION --- */
        .destinations { padding: 60px 50px; }

/* Cards ko ek line mein lane ke liye aur mobile par adjust karne ke liye */
.cards-container { 
    display: flex; 
    gap: 20px; 
    margin-top: 30px; 
    flex-wrap: wrap; /* Isse mobile par cards apne aap neeche aa jayenge */
    justify-content: center;
    padding-bottom: 50px;
}

.card {
    flex: 1; 
    min-width: 280px; /* Mobile par card ki width itni rahegi */
    max-width: 320px; /* Laptop par card bahut bada nahi dikhega */
    height: 400px; 
    border-radius: 25px;
    background-size: cover; 
    background-position: center;
    display: flex; 
    flex-direction: column; 
    justify-content: flex-end;
    padding: 20px; 
    color: white; 
    transition: 0.3s;
    cursor: pointer; /* Click karne wala icon banega */
}

/* Text aur design ko sundar banane ke liye */
.card h3 {
    font-size: 1.8rem;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
    margin: 0;
}

/* Mobile par layout ko aur behtar banane ke liye */
@media (max-width: 600px) {
    .hero h1 { font-size: 2.2rem; }
    .hero { padding-left: 20px; height: 400px; }
    .destinations { padding: 40px 20px; }
}
        /* --- 6. ABOUT US SECTION --- */
        .about-section {
            padding: 80px 50px;
            display: flex;
            align-items: center;
            gap: 50px;
            background: #fff;
        }
        .about-image { flex: 1; border-radius: 25px; overflow: hidden; }
        .about-image img { width: 100%; height: 100%; object-fit: cover; }
        .about-content { flex: 1; }
        .about-content h2 { font-size: 2.5rem; margin-bottom: 20px; color: #222; }
        .about-content p { color: #555; line-height: 1.8; margin-bottom: 25px; }
        .btn-black { background: #000; color: #fff; padding: 12px 30px; border-radius: 30px; text-decoration: none; }
        .login-link {
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    margin-right: 20px;
    transition: 0.3s;
    opacity: 0.8;
}

.login-link:hover {
    opacity: 1;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
}

/* Sign Up button ko highlight karne ke liye */
.signup-btn {
    background: #fff;
    color: #000 !important;
    padding: 10px 25px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
}

.signup-btn:hover {
    background: #2ecc71; /* Green hover effect */
    color: #fff !important;
}

/* Dono buttons ko ek line mein laane ke liye */
.auth-buttons {
    display: flex;
    align-items: center;
}

    </style>
</head>
<body>

    <div class="glass-panel">
        <nav>
            <div class="logo">Tourist fun</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="inquiry.html"></a>
                <a href="destination.html">Destinations</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="auth-buttons">
            <a href="login.html" class="login-link" style="color: white; margin-right: 15px; text-decoration: none;">Log In</a>
            <a href="inquiry.html"class="plan-btn"> Plane my trip </a>
            <a href="signup.html" class="signup-btn">Sign Up</a>
            </div>     
        </nav>

        <header class="hero">
            <h1>Discover Your Next Adventure</h1>
            <p>Book unique experiences and stays around the world.</p>
        </header>


<section class="destinations">
    <h2>Popular Destinations</h2>
    <div class="cards-container">
        <div class="card" onclick="window.location.href='goa-details.html';"
style="background-image: url('goa.jpeg');cursor: pointer;">

        <div class="card" onclick="window.location.href='kerala-details.html';"

        </div>

        <div class="card" onclick="window.location.href='manali-details.html';"
style="background-image: url('manali.jpeg');cursor: pointer;">
            <h3>Manali</h3>
        </div>
    </div>
</section>

    </div>
    <a href="inquiry.html" style="position: fixed; bottom: 20px; right: 20px; background: #2e7d32; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 24px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 1000; transition: 0.3s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
    📩
</a>

</body>
</html>
