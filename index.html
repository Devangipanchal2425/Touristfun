<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Adventure - All Sections</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        /* Smooth Custom Scrollbar for Glass Panel */
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    </style>
</head>
<body class="bg-[url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=80&w=2021&auto=format&fit=crop')] bg-no-repeat bg-center bg-cover bg-fixed h-screen flex justify-center items-center p-4 md:p-5">

    <!-- Main Glass Panel Container -->
    <div class="glass-panel bg-white/95 w-full max-w-[1100px] h-[90vh] rounded-[30px] overflow-y-auto custom-scroll relative shadow-2xl scroll-smooth">
        
        <!-- Navigation Bar -->
        <nav class="flex flex-col md:flex-row justify-between items-center p-6 md:px-12 md:py-6 gap-4 md:gap-0 sticky top-0 bg-white/95 md:bg-white/80 backdrop-blur-md z-50 rounded-t-[30px]">
            <!-- Logo in Black Color -->
            <div class="logo font-bold text-2xl text-slate-900 tracking-tight">Tourist fun</div>
            
            <!-- Navigation Links in Dark Color -->
            <div class="nav-links flex flex-wrap justify-center gap-4 md:gap-6 text-sm font-semibold">
                <a href="index.html" class="text-slate-800 hover:text-emerald-600 transition duration-300">Home</a>
                <a href="destination.html" class="text-slate-800 hover:text-emerald-600 transition duration-300">Destination</a>
                <a href="about.html" class="text-slate-800 hover:text-emerald-600 transition duration-300">About Us</a>
                <a href="contact.html" class="text-slate-800 hover:text-emerald-600 transition duration-300">Contact</a>
            </div>
            
            <!-- Auth Buttons Section -->
            <div class="auth-buttons flex flex-wrap items-center justify-center gap-3">
                <a href="login.html" class="text-slate-800 text-sm font-semibold transition duration-300 hover:text-emerald-600">Log In</a>
                <a href="inquiry.html" class="bg-[#e67e22] text-white px-4 py-2 rounded-full text-xs md:text-sm font-bold shadow-md hover:bg-[#d35400] transition duration-300 text-center">Plan my trip</a>
                <a href="signup.html" class="signup-btn bg-slate-900 text-white px-5 py-2 rounded-full text-xs md:text-sm font-semibold shadow-sm hover:bg-emerald-600 transition duration-300 text-center">Sign Up</a>
            </div>     
        </nav>

        <!-- Hero Section -->
        <header class="hero min-h-[350px] md:h-[500px] bg-gradient-to-b from-black/50 via-black/30 to-black/10 bg-[url('https://images.unsplash.com/photo-1454496522488-7a8e488e8606?q=80&w=2076&auto=format&fit=crop')] bg-center bg-cover rounded-t-[30px] flex flex-col justify-center px-6 md:px-12 text-white pt-24 md:pt-0">
            <h1 class="text-3xl md:text-6xl font-bold max-w-xl leading-tight drop-shadow-md">Discover Your Next Adventure</h1>
            <p class="text-sm md:text-lg mt-2 opacity-95 drop-shadow-sm">Book unique experiences and stays around the world.</p>
        </header>

        <!-- Destinations Section -->
        <section class="destinations p-6 md:p-12">
            <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-6">Popular Destinations</h2>
            
            <!-- Cards Grid Layout -->
            <div class="cards-container grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 justify-items-center pb-12">
                
                <!-- Goa Card -->
                <div onclick="window.location.href='goa-details.html';" 
                     class="card group w-full max-w-[320px] h-[350px] md:h-[400px] rounded-[25px] bg-cover bg-center flex flex-col justify-end p-5 text-white cursor-pointer shadow-lg hover:shadow-2xl hover:scale-[1.02] transition duration-300 relative overflow-hidden" 
                     style="background-image: url('goa.jpeg');">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-90 group-hover:from-black/90 transition duration-300"></div>
                    <h3 class="text-2xl font-bold z-10 drop-shadow-md">Goa</h3>
                </div>

                <!-- Kerala Card -->
                <div onclick="window.location.href='kerala-details.html';" 
                     class="card group w-full max-w-[320px] h-[350px] md:h-[400px] rounded-[25px] bg-cover bg-center flex flex-col justify-end p-5 text-white cursor-pointer shadow-lg hover:shadow-2xl hover:scale-[1.02] transition duration-300 relative overflow-hidden" 
                     style="background-image: url('kerala.jpeg');">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-90 group-hover:from-black/90 transition duration-300"></div>
                    <h3 class="text-2xl font-bold z-10 drop-shadow-md">Kerala</h3>
                </div>

                <!-- Manali Card -->
                <div onclick="window.location.href='manali-details.html';" 
                     class="card group w-full max-w-[320px] h-[350px] md:h-[400px] rounded-[25px] bg-cover bg-center flex flex-col justify-end p-5 text-white cursor-pointer shadow-lg hover:shadow-2xl hover:scale-[1.02] transition duration-300 relative overflow-hidden" 
                     style="background-image: url('manali.jpeg');">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-90 group-hover:from-black/90 transition duration-300"></div>
                    <h3 class="text-2xl font-bold z-10 drop-shadow-md">Manali</h3>
                </div>
                
            </div>
        </section>

    </div>

    <!-- Fixed Floating Inquiry Button -->
    <a href="inquiry.html" 
       class="fixed bottom-5 right-5 bg-emerald-700 text-white w-14 h-14 rounded-full flex justify-center items-center text-2xl shadow-xl z-50 transition duration-300 hover:scale-110 active:scale-95">
        📩
    </a>

</body>
</html>
